services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://projecthunt:${POSTGRES_PASSWORD:?set password}@db:5432/projecthunt
      PROJECTHUNT_API_KEY: ${PROJECTHUNT_API_KEY:?set API key}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: projecthunt
      POSTGRES_USER: projecthunt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecthunt"]
      interval: 5s
      retries: 12
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
